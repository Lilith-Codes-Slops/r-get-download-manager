[package]
name = "downloader-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless background daemon for the rget download manager"

[[bin]]
name = "downloader-core"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
downloader-ipc = { path = "../ipc" }
tokio = { workspace = true }
reqwest = { workspace = true }
hickory-resolver = { workspace = true }
httpdate = "1"
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
fs4 = { workspace = true }
sysinfo = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
async-trait = { workspace = true }
anyhow = { version = "1", optional = true }
librqbit = { workspace = true, optional = true, features = ["disable-upload"] }
librqbit-bencode = { version = "=9.1.0", optional = true }
librqbit-sha1-wrapper = { version = "=9.1.0", optional = true }
nix = { version = "0.31.3", features = ["fs", "user", "dir"] }
libc = "0.2.191"
futures-util = "0.3"

[features]
default = ["torrent"]
# Explicitly opt in to daemon-kill integration-test hooks; never use in production.
checkpoint-test-hooks = []
# Explicitly enable deterministic torrent daemon fault injection for tests only.
torrent-test-hooks = ["torrent"]
torrent = ["librqbit", "librqbit-bencode", "librqbit-sha1-wrapper", "anyhow"]
http3 = []
