[package]
name = "downloader-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPU-accelerated egui frontend for the rget download manager"

[[bin]]
name = "downloader-gui"
path = "src/main.rs"

[dependencies]
downloader-ipc = { path = "../ipc" }
eframe = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
url = "2.5.8"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
